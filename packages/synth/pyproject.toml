[project]
name = "rxsynth"
version = "0.1.0"
description = "Synthetic pharmaceutical market generator -- the only source of data in this repo"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "polars>=1.12",
    "duckdb>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rxsynth"]
